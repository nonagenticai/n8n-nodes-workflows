# CI for n8n-nodes-planka, a PUBLIC repository.
#
# Why this file is self-contained: a public repository may only call reusable workflows that are
# themselves public. The shared node archetype this package was built against lives in a PRIVATE
# repository, so calling it from here fails at 0s with "workflow was not found" (HTTP 422) and no
# job is created. That is measured, not theoretical: it is the same failure the org's other public
# node repository recorded when it was flipped.
#
# ⛔ Runner choice is load-bearing. Every ARC runner group is `allows_public_repositories: false`
# and must stay that way: a pull request from any fork can edit `runs-on`, so a self-hosted
# runner opened to this repo is arbitrary untrusted code inside the estate network. GitHub-hosted
# standard runners are the correct blast radius for a public repo, and are free here.
#
# Scope, stated honestly: this gate builds, lints and unit-tests the package, and publishes it to
# npmjs on a `v*` tag. It does NOT publish to the org's private package registry (unreachable from
# a GitHub-hosted runner) and it does NOT run a live-n8n compatibility gate (that needs a running
# n8n database).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never cancel a run for a tag: that run publishes the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Credentials. A full-tree scan is the honest one for a repo whose whole point is being public.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install betterleaks 1.10.1 (pinned, sha256-verified)
        run: |
          set -euo pipefail
          version=1.10.1
          sha=c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
          curl -fsSL -o "$RUNNER_TEMP/betterleaks.tgz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${version}/betterleaks_${version}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/betterleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tgz" -C "$RUNNER_TEMP" betterleaks
      # The two --disable-rule flags keep detection identical to the gitleaks
      # 8.30.1 this replaces: betterleaks' built-in defaults add
      # generic-credential-uri and generic-password, which gitleaks did not
      # have, and they fire on local dev DSNs and `PASSWORD:` placeholders
      # rather than credentials. Fleet decision 2026-11-13.
      - name: scan the tree
        run: |
          "$RUNNER_TEMP/betterleaks" dir --redact --exit-code 1 --no-banner \
            --disable-rule generic-credential-uri --disable-rule generic-password .

  # The other half of the public-repo rule: internal hostnames, tailnet addresses, home paths and
  # private repository names. Run it locally before pushing: `bash scripts/ci/no-private-refs.sh`.
  private-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: scan tracked files
        run: bash scripts/ci/no-private-refs.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      # No lockfile is committed (npm install, not npm ci) by deliberate fleet policy.
      - name: install
        run: npm install --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: test
        run: npm test

  # Publishing is tag-driven on purpose. npmjs rejects a re-publish of an existing version, so a
  # push-to-main trigger would go red on the second merge of the same version. The tag is the
  # release decision; `main` is not.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secret-scan, private-refs, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          registry-url: 'https://registry.npmjs.org'
      - name: install
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run build
      - name: the tag must equal package.json's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match package.json version $ver"
            exit 1
          fi
      - name: publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
